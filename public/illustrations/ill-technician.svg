<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="340" height="320" role="img" aria-label="Friendly installation technician holding a WiFi gateway with a toolbox">
  <!-- soft blob background -->
  <path d="M62 176c-14-52 18-104 74-118 52-13 118 2 140 46 22 45-2 98-46 122-46 25-152 22-168-50Z" fill="#edf8d3"/>
  <ellipse cx="170" cy="292" rx="104" ry="14" fill="#cbec82" opacity="0.55"/>
  <!-- wifi arcs above gateway -->
  <g stroke="#93d500" stroke-width="4.4" stroke-linecap="round" fill="none">
    <path d="M84 52a30 30 0 0 1 40 0"/>
    <path d="M92 64a19 19 0 0 1 24 0"/>
  </g>
  <circle cx="104" cy="74" r="3.6" fill="#00ae42"/>
  <!-- gateway in raised hand -->
  <rect x="88" y="84" width="32" height="56" rx="13" fill="#ffffff" stroke="#dadde6" stroke-width="2"/>
  <circle cx="104" cy="126" r="4" fill="#93d500"/>
  <!-- raised arm -->
  <path d="M152 150c-16-10-32-24-42-38" stroke="#8a5a3c" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- head + cap -->
  <circle cx="176" cy="92" r="27" fill="#8a5a3c"/>
  <path d="M149 88a27 27 0 0 1 50-14c2 4 3 8 4 12H190c-14 0-28 0-41 2Z" fill="#00ae42"/>
  <rect x="138" y="82" width="44" height="11" rx="5.5" fill="#008533"/>
  <!-- torso polo -->
  <rect x="138" y="118" width="76" height="102" rx="34" fill="#00ae42"/>
  <path d="M164 118h24l-8 14h-8Z" fill="#eafad0"/>
  <rect x="184" y="140" width="18" height="24" rx="4" fill="#ffffff"/>
  <rect x="184" y="140" width="18" height="7" rx="3.5" fill="#93d500"/>
  <!-- toolbox arm -->
  <path d="M204 152c10 14 16 28 18 42" stroke="#8a5a3c" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- toolbox -->
  <rect x="196" y="196" width="62" height="38" rx="9" fill="#25282e"/>
  <path d="M214 196c0-9 6-14 13-14s13 5 13 14" stroke="#93d500" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="222" y="206" width="12" height="8" rx="3" fill="#93d500"/>
  <!-- legs -->
  <path d="M158 220v58M192 220v58" stroke="#25282e" stroke-width="18" stroke-linecap="round"/>
  <rect x="142" y="272" width="34" height="14" rx="7" fill="#008533"/>
  <rect x="176" y="272" width="34" height="14" rx="7" fill="#008533"/>
  <!-- floating check -->
  <circle cx="266" cy="84" r="17" fill="#00ae42"/>
  <path d="m258 84 6 6 11-12" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- sparkles -->
  <g stroke="#93d500" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M56 128v12M50 134h12"/>
    <path d="M284 176v10M279 181h10"/>
  </g>
</svg>
