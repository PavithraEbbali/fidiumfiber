<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280" role="img" aria-label="Two people sharing popcorn on a couch during movie night">
  <!-- tv light wedge -->
  <path d="M0 52 156 118 0 190Z" fill="#93d500" opacity="0.10"/>
  <ellipse cx="150" cy="252" rx="122" ry="18" fill="#93d500" opacity="0.10"/>
  <!-- couch back -->
  <rect x="42" y="120" width="216" height="62" rx="26" fill="#34373a"/>
  <path d="M52 124h196" stroke="#93d500" stroke-width="2.4" stroke-linecap="round" opacity="0.4"/>
  <!-- people -->
  <g>
    <!-- person A -->
    <circle cx="112" cy="106" r="21" fill="#8a5a3c"/>
    <path d="M92 102a21 21 0 0 1 37-11c2 3 3 7 4 11-7-8-14-11-22-11-7 0-13 3-19 11Z" fill="#191a1c"/>
    <rect x="86" y="122" width="52" height="56" rx="24" fill="#dff5ac"/>
    <!-- person B leaning slightly -->
    <g transform="rotate(-4 188 140)">
      <circle cx="188" cy="103" r="22" fill="#e8b08c"/>
      <path d="M166 100a22 22 0 0 1 40-12c2 4 4 8 4 12-8-8-16-12-25-12-7 0-13 4-19 12Z" fill="#4a3126"/>
      <rect x="196" y="108" width="12" height="30" rx="6" fill="#4a3126"/>
      <rect x="162" y="122" width="54" height="58" rx="25" fill="#00ae42"/>
    </g>
  </g>
  <!-- popcorn -->
  <g>
    <circle cx="146" cy="140" r="4.6" fill="#fff"/>
    <circle cx="155" cy="136" r="4.2" fill="#f2f2f2"/>
    <circle cx="151" cy="145" r="4.6" fill="#fff"/>
    <circle cx="160" cy="143" r="4" fill="#f2f2f2"/>
    <path d="M136 146h30l-4 18c-1 4-4 6-8 6h-6c-4 0-7-2-8-6Z" fill="#93d500"/>
  </g>
  <!-- blanket -->
  <path d="M86 166h130c6 0 10 4 10 10v6c0 6-4 10-10 10H96c-6 0-10-4-10-10Z" fill="#245c36" opacity="0.92"/>
  <!-- couch seat + arms -->
  <rect x="42" y="176" width="216" height="56" rx="22" fill="#3b3d3f"/>
  <circle cx="52" cy="182" r="22" fill="#43464a"/>
  <circle cx="248" cy="182" r="22" fill="#43464a"/>
  <!-- legs -->
  <rect x="70" y="230" width="12" height="12" rx="4" fill="#191a1c"/>
  <rect x="218" y="230" width="12" height="12" rx="4" fill="#191a1c"/>
</svg>
