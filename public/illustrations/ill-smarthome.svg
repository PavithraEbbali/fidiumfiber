<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280" role="img" aria-label="Person controlling smart-home devices from their phone">
  <ellipse cx="140" cy="256" rx="110" ry="16" fill="#93d500" opacity="0.10"/>
  <!-- dotted links from phone to devices -->
  <g stroke="#93d500" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 7" fill="none" opacity="0.75">
    <path d="M96 158c34-44 78-70 116-76"/>
    <path d="M96 162c46-10 96-6 128 10"/>
    <path d="M96 168c36 22 74 40 108 48"/>
  </g>
  <!-- device chips -->
  <g>
    <g transform="translate(196 52)">
      <rect width="46" height="46" rx="13" fill="#14281d" stroke="#2e4a3a"/>
      <circle cx="23" cy="20" r="8" fill="none" stroke="#93d500" stroke-width="3"/>
      <rect x="18" y="29" width="10" height="7" rx="2.5" fill="#93d500"/>
    </g>
    <g transform="translate(232 128)">
      <rect width="46" height="46" rx="13" fill="#14281d" stroke="#2e4a3a"/>
      <rect x="9" y="14" width="22" height="15" rx="5" fill="none" stroke="#dff5ac" stroke-width="2.6"/>
      <circle cx="20" cy="21.5" r="3.4" fill="#93d500"/>
      <path d="M31 18l7-4v13l-7-4Z" fill="#dff5ac"/>
    </g>
    <g transform="translate(192 196)">
      <rect width="46" height="46" rx="13" fill="#14281d" stroke="#2e4a3a"/>
      <circle cx="23" cy="23" r="11" fill="none" stroke="#93d500" stroke-width="3"/>
      <path d="M23 16v7" stroke="#dff5ac" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- figure -->
  <g>
    <!-- far arm down -->
    <path d="M148 132c8 18 10 34 8 50" stroke="#96613f" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- legs -->
    <path d="M116 196v50M138 196v50" stroke="#25282e" stroke-width="16" stroke-linecap="round"/>
    <rect x="102" y="240" width="30" height="13" rx="6.5" fill="#93d500"/>
    <rect x="126" y="240" width="30" height="13" rx="6.5" fill="#93d500"/>
    <!-- torso -->
    <rect x="96" y="102" width="60" height="100" rx="28" fill="#008533"/>
    <rect x="120" y="102" width="12" height="58" rx="6" fill="#00ae42"/>
    <!-- phone arm -->
    <path d="M106 128 82 156" stroke="#b67a54" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- phone -->
    <g transform="rotate(-12 78 168)">
      <rect x="64" y="146" width="28" height="46" rx="7" fill="#191a1c" stroke="#93d500" stroke-width="1.6"/>
      <rect x="70" y="154" width="16" height="10" rx="3" fill="#93d500" opacity="0.9"/>
      <rect x="70" y="168" width="16" height="4" rx="2" fill="#2e4a3a"/>
      <rect x="70" y="175" width="10" height="4" rx="2" fill="#2e4a3a"/>
    </g>
    <!-- head -->
    <circle cx="126" cy="76" r="23" fill="#b67a54"/>
    <circle cx="112" cy="58" r="9" fill="#191a1c"/>
    <circle cx="127" cy="52" r="10" fill="#191a1c"/>
    <circle cx="141" cy="58" r="9" fill="#191a1c"/>
  </g>
</svg>
