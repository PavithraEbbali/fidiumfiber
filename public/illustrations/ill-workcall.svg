  <!-- mug -->
  <rect x="256" y="180" width="20" height="20" rx="5" fill="#93d500"/>
  <path d="M276 185c6 0 6 10 0 10" stroke="#93d500" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M262 172c0-4 3-4 3-7M270 172c0-4 3-4 3-7" stroke="#dff5ac" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.8"/>
