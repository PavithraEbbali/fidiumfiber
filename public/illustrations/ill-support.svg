<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240" role="img" aria-label="Support agent with a headset waving hello">
  <!-- glow ring -->
  <circle cx="140" cy="128" r="82" fill="none" stroke="#93d500" stroke-width="10" opacity="0.16"/>
  <ellipse cx="140" cy="216" rx="92" ry="13" fill="#93d500" opacity="0.12"/>
  <!-- waving arm -->
  <path d="M96 172c-14-12-24-28-26-46" stroke="#e8b08c" stroke-width="13" stroke-linecap="round" fill="none"/>
  <circle cx="70" cy="118" r="9.5" fill="#e8b08c"/>
  <!-- torso -->
  <rect x="94" y="146" width="92" height="72" rx="34" fill="#dff5ac"/>
  <path d="M128 146h24l-12 18Z" fill="#0e1a14"/>
