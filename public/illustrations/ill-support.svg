  <path d="M168 114c0 12-10 18-22 19" stroke="#25282e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="144" cy="134" r="4.4" fill="#93d500"/>
  <!-- chat bubble -->
  <g>
    <rect x="178" y="44" width="66" height="38" rx="17" fill="#93d500"/>
    <path d="m192 80-6 14 18-10Z" fill="#93d500"/>
    <circle cx="198" cy="63" r="4" fill="#0e1a14"/>
    <circle cx="211" cy="63" r="4" fill="#0e1a14"/>
    <circle cx="224" cy="63" r="4" fill="#0e1a14"/>
  </g>
</svg>
